slug: double-descent-random-features
direction: 'Double descent in random-features regression: sweep the number of random
  ReLU features through the interpolation threshold on a synthetic regression task
  and on scikit-learn''s digits (as regression to one-hot labels). How do label noise
  and ridge regularisation change the height and position of the test-error peak,
  and does optimally tuned ridge remove it?'
problem: Test-error peak of random-ReLU-features ridge regression at the interpolation
  threshold, and its dependence on label noise and ridge.
gap: Small reproducible finite-sample measurement of peak height/position vs noise
  and ridge, and of whether tuned ridge removes the peak, on synthetic and digits
  regression.
contribution: Empirical, pre-registered study (n=200, 5 seeds) of peak height, position
  and a bump statistic under label noise and ridge, comparing min-norm, fixed, global-tuned
  and per-width tuned ridge.
hypotheses:
- id: H1
  statement: Min-norm peak lies at N/n in [0.9,1.1]
  test: median peak_pos per noisy task
- id: H2
  statement: Peak height of min-norm grows with label noise
  test: mean peak_mse strictly increasing in noise; paired Wilcoxon lowest vs highest
- id: H3
  statement: Larger fixed ridge lowers the peak
  test: mean peak_mse non-increasing in lambda
- id: H4
  statement: Per-width tuned ridge removes the peak
  test: mean bump_rel<0.05 on every task and below MinNorm (rh compare)
- id: H5
  statement: Other tuning protocols also remove the bump (exploratory)
  test: mean bump_rel<0.05
method:
  name: TunedRidge
  summary: Random ReLU features ridge regression with the ridge strength chosen per
    width on a held-out validation set.
  components:
  - per-width validation tuning
  entrypoint: method/run.py
