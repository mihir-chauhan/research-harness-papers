slug: overestimation-q-learning-vs-double-q-learning
direction: 'Overestimation: Q-learning vs double Q-learning. numpy tabular agents
  on a small MDP with a noisy-reward branch (Sutton and Barto maximisation-bias example)
  and on a 20-state random MDP; 1,000 runs; measure the estimated-minus-true value
  of the start state and the fraction of suboptimal actions per episode. Keep it a
  small CPU study with reimplemented baselines, at least 5 seeds where cheap, and
  report negative or mixed results plainly.'
problem: Q-learning bootstraps from the maximum of noisy action-value estimates, which
  is positively biased (maximisation bias); double Q-learning decouples action selection
  from evaluation to remove it. How large are these biases, and what do they cost
  in policy quality, in a bandit-like trap MDP and in random MDPs?
gap: Most evidence for double Q-learning comes from the single Sutton-Barto trap MDP
  or from deep RL, where bias is confounded with function approximation. A controlled
  tabular comparison on random MDPs, with exact true values, with matched learning
  rate and exploration, and with ablations that separate decoupling from slower learning
  and from adaptive data collection, is rarely reported.
contribution: A reproducible, vectorised (1,000 independent runs per seed) tabular
  study of the estimated-minus-true value bias and the suboptimal-action rate of Q-learning,
  Double Q-learning, Weighted Double Q-learning and Maxmin Q-learning, with sensitivity
  sweeps over noise, number of actions, step size and exploration, and a warm-start
  ablation that separates transient from steady-state bias.
hypotheses:
- id: H1
  statement: On the maximisation-bias MDP, Q-learning overestimates the value of the
    trap action (Q(A,left) minus its true value is positive) and Double Q-learning
    does not (estimated-minus-true is lower than for Q-learning).
  test: Welch t-test over 5 seeds (seed means of 1,000 runs) of qbias_final, Double
    Q-learning vs Q-learning, rh compare, alpha 0.05.
- id: H2
  statement: On the maximisation-bias MDP, Double Q-learning takes fewer suboptimal
    actions at the start state than Q-learning over the training episodes.
  test: rh compare on subopt_all (lower is better), Double Q-learning vs Q-learning,
    5 seeds, alpha 0.05.
- id: H3
  statement: On the 20-state random MDP, Q-learning has a positive start-state estimated-minus-true
    bias that Double Q-learning removes, and Double Q-learning does not take fewer
    suboptimal actions.
  test: rh compare on bias_final and subopt_all for the random20 task, Double Q-learning
    vs Q-learning, alpha 0.05. The first half is expected to be refuted if bias_final
    of Q-learning is not positive.
- id: H4
  statement: The Q-learning bias grows with the noise scale (random MDP) and with
    the number of actions at the trap state, and Double Q-learning stays below Q-learning
    at every setting.
  test: sweep groups sweep_sigma and sweep_actions; the claim is read only at the
    swept grid values, from tables of seed means.
method:
  name: Double Q-learning
  summary: Two tables updated alternately; the greedy action is chosen by the table
    being updated and evaluated by the other (van Hasselt 2010). Compared with Q-learning,
    Weighted Double Q-learning and Maxmin Q-learning, all reimplemented in numpy with
    identical step size, exploration and budget.
  components:
  - decoupled selection and evaluation
  - alternating updates
  entrypoint: method/run.py
