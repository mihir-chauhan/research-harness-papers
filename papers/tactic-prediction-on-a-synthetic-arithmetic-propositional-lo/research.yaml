slug: tactic-prediction-on-a-synthetic-arithmetic-prop
direction: Tactic-prediction on a synthetic arithmetic / propositional logic prover.
  Implement a tiny sequent-calculus prover for propositional logic in Python (rules
  as tactics) and generate 20k random provable sequents with proofs. Train a small
  transformer or MLP policy to pick the next rule; compare best-first search guided
  by the policy against breadth-first and a hand-written heuristic on proofs found
  within 100 expansions, for formulas larger than those in training. Keep it a small
  CPU study with reimplemented baselines, at least 5 seeds where cheap, and report
  negative or mixed results plainly.
problem: Does a small learned tactic policy guide best-first proof search in a propositional
  sequent calculus better than breadth-first search and a hand-written heuristic,
  within 100 expansions, on formulas larger than any seen in training?
gap: Neural tactic prediction is usually evaluated on large formal libraries where
  the cost of the baselines is hidden; here the prover is small enough to compute
  optimal proofs, tune a hand heuristic fairly, and measure size generalisation exactly.
contribution: A controlled small-scale comparison (5 seeds) of a transformer policy,
  a feature MLP, BFS and a tuned hand heuristic under one shared search engine and
  an equal 100-expansion budget, with per-size breakdown, budget sweep, training-size
  sweep and search-mode ablations.
hypotheses:
- id: H1
  statement: On sequents larger than the training range, best-first search guided
    by the transformer policy solves more problems within 100 expansions than BFS.
  test: Paired Welch/permutation comparison over 5 seeds (rh compare) of solved rate,
    per test bin; supported if policy > BFS with p<0.05 in all three bins.
- id: H2
  statement: The transformer policy solves more problems than the tuned hand-written
    heuristic on the largest test bin (41-70 connectives).
  test: rh compare of solved rate on test_41_70 over 5 seeds; refuted if heuristic
    >= policy.
- id: H3
  statement: 'Policy quality degrades with size: the policy advantage (or deficit)
    versus the heuristic becomes worse from the 11-20 bin to the 41-70 bin.'
  test: Difference solved(policy)-solved(heuristic) per bin from rh compare; supported
    if the difference decreases monotonically across the three bins.
- id: H4
  statement: 'Search matters: best-first search with the policy beats following the
    policy greedily (no backtracking) in the largest bin.'
  test: rh compare solved rate on test_41_70, transformer best-first vs greedy ablation,
    5 seeds.
method:
  name: Transformer policy
  summary: Small transformer scoring every candidate (side, compound formula) tactic
    of a sequent, trained by imitation of optimal proofs (min proof size via DP);
    used as -log p step cost in best-first search over proof states.
  components:
  - transformer scorer
  - optimal-proof imitation labels
  - best-first search by cumulative -log p
  entrypoint: method/run.py
