project: 2d-ising-monte-carlo-with-a-phase-classifier
field: physics/lattice-models-phase-transitions
problem: Locate the critical temperature of the 2D Ising model from labelled configurations
  of the two phases only, using a classifier output crossing and finite-size scaling,
  and compare against label-free readouts.
gap: Phase-classifier papers usually show single-size crossings and quote Tc without
  separating the finite-size bias, the choice of classifier (linear, MLP, CNN), the
  Z2 symmetry, and the training window; unsupervised (PCA) and confusion readouts
  are rarely compared on identical data with identical seeds and error definitions.
contribution: A controlled, seed-paired comparison on identical Swendsen-Wang data
  of seven readouts (four supervised, PCA, confusion, a Binder/susceptibility reference),
  with single-size and FSS-collapse Tc errors against the Onsager value, plus sensitivity
  to the training window and training set size.
hypotheses:
- id: H1
  statement: MLP and CNN single-size crossing at L=32 has lower Tc error than PCA
    at L=32.
  test: paired Wilcoxon over 10 seeds (rh compare), tc_error_l32
- id: H2
  statement: The FSS collapse reduces the Tc error relative to the L=32 crossing for
    CNN and MLP.
  test: paired Wilcoxon over seeds, tc_error_fss vs tc_error_l32 (analysis run)
- id: H3
  statement: Logistic regression on raw spins fails (held-out far accuracy < 0.6)
    due to Z2 symmetry; Z2 gauge fixing restores it (> 0.6).
  test: mean acc_far over seeds
- id: H4
  statement: PCA and confusion do not beat the CNN on FSS Tc error.
  test: paired Wilcoxon over seeds, tc_error_fss
- id: H5
  statement: The collapse exponent of CNN/MLP is within 0.25 of nu=1 on average.
  test: mean nu_error_fss < 0.25
- id: H6
  statement: CNN/MLP Tc error is insensitive (within 2x of default) to training margin
    and training set size.
  test: sweep_margin and sweep_nsamp groups
method:
  name: CNN
  summary: Small periodic CNN (two 3x3 circular conv layers, 8 channels, global average
    pool, linear) trained as an ordered/disordered classifier on T<=1.97 and T>=2.57;
    Tc from the 0.5 crossing of the held-out mean output, and from an FSS collapse
    over L=16,24,32.
  components:
  - circular conv
  - global average pooling
  - windowed training
  - 0.5-crossing readout
  - FSS collapse
  entrypoint: method/run.py
tasks:
- ising_L16_L24_L32
