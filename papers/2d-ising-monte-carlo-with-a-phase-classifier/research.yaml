- LogReg (raw)
- LogReg (Z2-fixed)
- MLP
- PCA
- Confusion (MLP)
- Binder/chi (reference)
ablations:
- CNN
- MLP
ambition:
  target_tier: 2
  primary_metric: tc_error_fss
  primary_task: ising
  alpha: 0.05
  min_relative_gain: 0.1
  min_effect_size: 0.8
  groundbreaking_gain: 0.3
  max_iterations: 12
  patience: 3
  gpu_hour_budget: 2
gates: []
profile: quick
venue: ieee-icra
constants:
- name: tc_exact
  value: 2.269185
  why: Onsager critical temperature 2/ln(1+sqrt2) in units J/k_B
- name: n_temps
  value: 40
  why: temperature grid points in [1.5,3.5]
- name: n_samples_per_T
  value: 200
  why: samples per temperature = 4 chains x 50
- name: n_chains
  value: 4
  why: independent Markov chains per temperature
- name: n_per_chain
  value: 50
  why: samples per chain
- name: sw_gap
  value: 10
  why: Swendsen-Wang sweeps between stored samples
- name: sw_therm
  value: 100
  why: thermalisation sweeps
- name: n_seeds
  value: 10
  why: seeds 0-9 in the main group
- name: train_lo
  value: 1.97
  why: ordered training window upper edge, Tc_ref(2.27) minus margin 0.3
- name: train_hi
  value: 2.57
  why: disordered training window lower edge, Tc_ref(2.27) plus margin 0.3
- name: tc_ref
  value: 2.27
  why: rounded Tc used only to place the training windows
- name: collapse_window
  value: 0.6
  why: half-width of |T-Tc| window used in the collapse cost
- name: epochs
  value: 20
  why: training epochs of supervised models
- name: batch_size
  value: 128
  why: mini-batch size
- name: lr
  value: 0.001
  why: Adam learning rate
- name: mlp_hidden
  value: 64
  why: MLP hidden units
- name: cnn_channels
  value: 8
  why: CNN channels
- name: conf_epochs
  value: 8
  why: epochs of each confusion network
- name: conf_hidden
  value: 32
  why: hidden units of each confusion network
- name: temp_step
  value: 0.0513
  why: spacing of the 40-point temperature grid, 2/39
- name: grid_resolution_tc
  value: 0.005
  why: Tc grid step of the collapse search
- name: margin_default
  value: 0.3
  why: default training-window half gap delta
- name: data_seed_stride
  value: 1000
  why: data seed = 1000*seed + L
- name: tc_grid_node
  value: 2.26923
  why: 'temperature grid node nearest the exact Tc: 1.5+15*2/39 (differs from Tc by
    5e-5)'
- name: nsamp_ep10_epochs
  value: 100
  why: 'epochs of the update-matched sweep at 10 samples/chain: 1000/10 (default 50
    samples x 20 epochs = 1000)'
