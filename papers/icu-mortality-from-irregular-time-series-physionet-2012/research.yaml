slug: icu-mortality-from-irregular-time-series-physion
direction: ICU mortality from irregular time series (PhysioNet 2012). Download set-a of the PhysioNet 2012 challenge (4,000 stays, open access). Compare logistic regression and gradient boosting on per-variable
  summary statistics against a GRU with mask and time-delta inputs (GRU-D style) and a GRU on forward-filled values. Report AUROC, AUPRC and Brier score with 5-fold patient-level CV. Keep it a small CPU
  study with reimplemented baselines, at least 5 seeds where cheap, and report negative or mixed results plainly.
problem: In-hospital mortality prediction from the first 48 h of irregularly sampled, mostly missing ICU measurements (PhysioNet/CinC 2012 set-a, 4,000 stays).
gap: Recurrent models with explicit missingness handling (GRU-D) are routinely reported as improving on feature-engineered baselines, but on small cohorts the comparison is rarely run with equal tuning
  budgets, repeated patient-level CV and a decomposition of which ingredient (masks, time-deltas, decay) matters.
contribution: A controlled, equally tuned, 5-seed x 5-fold patient-level comparison of LR and gradient boosting on summary features against a forward-filled GRU, a GRU with mask and time-delta inputs and
  a reimplemented GRU-D, with ablations of the decay mechanism and of count (missingness) features, and an observation-horizon sweep.
hypotheses:
- id: H1
  statement: GRU-D does not outperform gradient boosting on summary features in AUROC on set-a (summary-feature baselines remain competitive).
  test: Paired comparison over 5 seeds of fold-averaged AUROC (rh compare, GRU-D as reference vs GBDT). Refuted if GRU-D exceeds GBDT by more than 0.01 AUROC with p<0.05.
- id: H2
  statement: Giving a GRU the observation mask and time-delta (GRU mask+delta, GRU-D) improves AUROC over a GRU on forward-filled values.
  test: rh compare on AUROC, reference GRU (forward-fill), 5 seeds, p<0.05 and difference >0.
- id: H3
  statement: GRU-D decay (input and hidden) gives additional AUROC over the plain mask+delta GRU.
  test: rh compare on AUROC, reference GRU (mask+delta), p<0.05; plus decay ablation group.
- id: H4
  statement: 'Missingness counts carry predictive signal: removing per-variable observation counts from the summary features lowers AUROC of GBDT and LR.'
  test: rh compare within group abl_counts, AUROC, 5 seeds, p<0.05.
- id: H5
  statement: 'Exploratory: the ranking of the systems is stable when only the first 12 h or 24 h of data are used.'
  test: Horizon sweep (12, 24 h vs 48 h in main); report per-horizon AUROC; no formal test.
method:
  name: GRU-D
  summary: Reimplementation of GRU-D (Che et al. 2018) with trainable input decay toward the last observation and hidden-state decay on hourly-binned PhysioNet 2012 data, compared with summary-feature LR/GBDT
    and GRU variants.
  components:
  - input decay
  - hidden decay
  - mask input
  entrypoint: method/run.py
