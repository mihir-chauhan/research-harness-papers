constants:
- name: n_eval_points
  value: 10000
  why: 'points per evaluation: generated samples, held-out reference and real-data
    floor set (run.py --nref default)'
- name: train_updates
  value: 3000
  why: optimiser updates per trained network (run.py --iters default)
- name: mmd_points
  value: 3000
  why: points of each set used for the MMD estimate (run.py --nmmd default)
- name: train_updates_first_plan
  value: 5000
  why: update count planned before the budget cut recorded with rh decide; no run
    used it
- name: batch_size
  value: 512
  why: training batch size (run.py --bs default)
- name: mlp_width
  value: 128
  why: hidden width of the shared MLP
- name: diffusion_timesteps
  value: 1000
  why: number of DDPM timesteps T
- name: reflow_pairs
  value: 20000
  why: noise/sample pairs generated by the reflow teacher (run.py --npairs default)
- name: sw_directions
  value: 256
  why: fixed projection directions of the sliced Wasserstein distance
- name: straightness_samples
  value: 2000
  why: trajectories averaged in the straightness measure
- name: max_sampling_steps
  value: 100
  why: largest sampling step count K, also the step count of the default reflow teacher
    and of the straightness paths
- name: learning_rate
  value: 0.002
  why: Adam learning rate before cosine annealing (run.py --lr default)
- name: beta_min
  value: 0.0001
  why: first beta of the linear DDPM schedule
- name: beta_max
  value: 0.02
  why: last beta of the linear DDPM schedule
- name: cosine_offset
  value: 0.008
  why: offset s of the cosine schedule
- name: mmd_bandwidth_2
  value: 0.3
  why: second RBF bandwidth of the MMD kernel
- name: cosine_start_alpha_bar
  value: 4.0e-05
  why: alpha-bar threshold of the truncated-start cosine DDIM diagnostic (run.py --start_ab
    4e-5)
- name: mmd_bandwidth_1
  value: 0.1
  why: smallest RBF bandwidth of the MMD kernel
- name: eight_gaussians_std
  value: 0.1
  why: component standard deviation of the eight Gaussians task
- name: two_moons_noise
  value: 0.05
  why: Gaussian noise std of the two moons task before scaling
- name: test_alpha
  value: 0.05
  why: significance level of the registered tests (research.yaml ambition.alpha)
- name: ema_decay
  value: 0.999
  why: EMA decay of the network weights
- name: cosine_beta_clip
  value: 0.999
  why: upper clip of beta in the cosine schedule
