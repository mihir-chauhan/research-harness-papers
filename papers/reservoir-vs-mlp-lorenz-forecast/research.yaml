direction: 'Forecasting chaos: ESN vs MLP on delay coordinates vs small GRU for Lorenz-63
  and Lorenz-96; valid prediction time and attractor statistics; reservoir sensitivity;
  data requirements.'
problem: Compare reservoir computing with delay-coordinate MLPs and GRUs for closed-loop
  forecasting of low-dimensional chaos, under one protocol, with sensitivity and data-scaling
  analyses.
gap: Comparisons usually tune or measure model families differently; a small controlled
  head-to-head including climate metrics and data scaling is cheap to replicate on
  CPU.
contribution: A controlled, reproducible CPU-scale comparison (no new method) of ESN,
  MLP and GRU on Lorenz-63 and Lorenz-96 with sweeps over spectral radius, reservoir
  size and training length.
hypotheses:
- id: H1
  statement: At tuned defaults and 5000 training steps the ESN has longer mean VPT
    than MLP and GRU on both tasks.
  test: Paired comparison over 5 seeds with rh compare, alpha 0.05, plus mean ordering.
- id: H2
  statement: VPT and climate fidelity (clim_ok) rank the systems differently on at
    least one task.
  test: Compare orderings of seed-mean vpt and clim_ok.
- id: H3
  statement: ESN VPT varies by more than a factor 2 across the swept spectral radii
    on each task.
  test: Ratio of best to worst seed-mean VPT over the sweep.
- id: H4
  statement: ESN VPT at N=1000 exceeds that at N=100 on both tasks.
  test: Seed-mean comparison (3 seeds).
- id: H5
  statement: With 500 training steps the ESN has longer VPT than MLP and GRU on both
    tasks.
  test: Seed-mean comparison (3 seeds).
method:
  name: ESN
  summary: Echo state network (sparse tanh reservoir, ridge readout with squared even
    features) trained for one-step prediction and run in closed loop; the reference
    system of the comparison, reimplemented from Pathak et al.
  components:
  - sparse reservoir
  - ridge readout
  - squared even-node features
  entrypoint: method/run.py
tasks:
- lorenz63
- lorenz96
metrics:
  vpt:
    higher_is_better: true
  vpt_min:
    higher_is_better: true
  clim_w1:
    higher_is_better: false
  clim_ok:
    higher_is_better: true
  blowup:
    higher_is_better: false
  clim_w1_max:
    higher_is_better: false
  fit_seconds:
    higher_is_better: false
    nondeterministic: true
seeds:
- 0
- 1
- 2
- 3
- 4
compute:
  gpus: 0
  max_minutes_per_run: 6
  max_total_minutes: 45
baselines:
- MLP delay
- GRU
ablations:
- name: ESN without squared features
  group: main
ambition:
  target_tier: 2
  primary_metric: vpt
  primary_task: lorenz63
  alpha: 0.05
  min_relative_gain: 0.1
  min_effect_size: 0.8
  groundbreaking_gain: 0.3
  max_iterations: 12
  patience: 3
  gpu_hour_budget: 2
gates: []
profile: quick
venue: ieee-icra
constants:
- name: mlp_hidden_units
  value: 128
  why: width of each of the three hidden layers of the MLP baseline (method/lib.py,
    MLP hidden=128)
- name: mlp_batch_size
  value: 256
  why: minibatch size of the MLP baseline's Adam training (method/lib.py, MLP.fit)
- name: climate_reference_steps
  value: 15000
  why: length in samples of the true-system reference trajectory the climate metric
    compares free runs with (method/lib.py, make_data)
- name: burnin_samples
  value: 200
  why: samples discarded as burn-in before each generated trajectory is recorded (method/lib.py,
    integrate burn=200)
- name: warmup_steps
  value: 100
  why: true states used to warm up every closed-loop rollout; also the ESN readout
    washout (method/lib.py, washout=100)
- name: rollout_clamp
  value: 1000
  why: componentwise clamp of predicted states in every rollout, standardised units
    (method/lib.py, clip to +-1e3)
- name: dt_lorenz63
  value: 0.02
  why: sampling interval of the Lorenz-63 trajectories (method/lib.py, DT)
- name: dt_lorenz96
  value: 0.05
  why: sampling interval of the Lorenz-96 trajectories (method/lib.py, DT)
- name: vpt_error_threshold
  value: 0.4
  why: 'normalised RMS error above which a forecast stops being valid: the threshold
    in the definition of VPT (method/lib.py, valid_time thr)'
- name: climate_ok_threshold
  value: 0.1
  why: 'Wasserstein distance below which a free run counts as reproducing the climate:
    the threshold in the definition of clim_ok (method/lib.py, OK_THR)'
- name: climate_run_steps
  value: 10000
  why: length in samples of each free run scored by the climate metric (method/lib.py,
    CLIM_LEN)
- name: esn_default_size
  value: 500
  why: default number of reservoir nodes N of the ESN (method/lib.py, ESN size=500)
- name: validation_seed
  value: 100
  why: seed of the separate validation trajectory used only for tuning (method/tune.py)
- name: significance_alpha
  value: 0.05
  why: significance level of the registered paired tests (research.yaml ambition.alpha,
    proposal.md)
- name: tuning_grid_rho_mid
  value: 0.9
  why: middle value of the ESN spectral-radius tuning grid {0.4, 0.9, 1.4} (method/tune.py)
- name: tuning_grid_ridge_mid
  value: 1.0e-06
  why: middle value of the ESN ridge tuning grid {1e-8, 1e-6, 1e-4} (method/tune.py)
- name: tuning_grid_noise_low
  value: 0.01
  why: second value of the input-noise tuning grids of the MLP and GRU (method/tune.py)
