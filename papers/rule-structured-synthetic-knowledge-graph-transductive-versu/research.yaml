slug: rule-structured-synthetic-knowledge-graph-transd
direction: Rule-structured synthetic knowledge graph, transductive versus inductive.
  Generate a family-tree knowledge graph (500 people, relations parent / sibling /
  grandparent / uncle derived by rules). Train TransE and a small path-based model
  (2-hop relational message passing) and test on held-out triples of the same graph
  and on a freshly generated graph with new entities; report MRR in both settings.
  Keep it a small CPU study with reimplemented baselines, at least 5 seeds where cheap,
  and report negative or mixed results plainly.
problem: Do embedding-based and path-based knowledge-graph completion models recover
  rule-structured relations (parent/sibling/grandparent/uncle) on held-out triples
  of the training graph, and does that carry over to a freshly generated graph with
  entirely new entities?
gap: Transductive embedding models are known to be unable to score unseen entities,
  and path-based GNNs are inductive by construction, but the size of the gap, how
  it varies per rule-derived relation, and how fairly-treated embedding baselines
  (fold-in of new entities) close it is rarely measured in a fully controlled rule-generated
  setting.
contribution: A controlled, fully reproducible CPU study on synthetic family-tree
  KGs (5 seeds, each a distinct graph pair) of TransE, TransE with entity fold-in,
  a 2-hop query-conditioned relational message-passing model and a hand-written rule
  oracle, with depth, query-edge-removal and message-graph-density ablations.
hypotheses:
- id: H1
  statement: On held-out triples of the training graph, Path-MP (2 layers) has higher
    filtered MRR than TransE.
  test: Paired t-test over 5 seeds (rh compare), metric mrr, task transductive, alpha
    0.05
- id: H2
  statement: On a fresh graph with new entities TransE collapses to near-chance MRR
    while Path-MP keeps its transductive MRR (drop of less than 0.05 absolute).
  test: rh compare transductive vs inductive MRR per system; effect size in absolute
    MRR
- id: H3
  statement: Fold-in of new entity embeddings gives TransE a large inductive gain
    over frozen random embeddings, but it stays below Path-MP.
  test: Paired t-test over 5 seeds, inductive task, TransE+fold-in vs TransE and vs
    Path-MP
- id: H4
  statement: 'Path-MP''s accuracy needs depth 2 (all four relations are derived by
    2-hop rules): 1 layer is clearly worse, 3 layers no better; and training without
    removing the query edge hurts.'
  test: sweep_layers and abl_nodrop groups vs main, rh compare, both tasks
- id: H5
  statement: Inductive Path-MP MRR degrades as the observed message graph of the new
    entities gets sparser.
  test: 'sweep_density: obs_frac in {0.25,0.5,0.75} plus main row at 1.0'
method:
  name: Path-MP (2-hop)
  summary: Query-conditioned relational message passing (NBFNet-style, 2 layers, sum
    aggregation) trained with 1-vs-all cross-entropy and per-query removal of the
    target edge; scores every entity as a tail for (h, r, ?).
  components:
  - relation-conditioned messages
  - boundary condition at the query entity
  - query-edge removal
  entrypoint: method/run.py
tasks:
- transductive
- inductive
metrics:
  mrr:
    higher_is_better: true
  hits1:
    higher_is_better: true
  hits10:
    higher_is_better: true
  mrr_parent:
    higher_is_better: true
  mrr_sibling:
    higher_is_better: true
  mrr_grandparent:
    higher_is_better: true
  mrr_uncle:
    higher_is_better: true
seeds:
- 0
- 1
- 2
- 3
- 4
