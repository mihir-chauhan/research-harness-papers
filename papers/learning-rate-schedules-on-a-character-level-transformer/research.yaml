slug: learning-rate-schedules-on-a-character-level-tra
direction: Learning-rate schedules on a character-level transformer. 2-layer, 128-dimensional
  GPT on Tiny Shakespeare (characters) for 1,500 steps on CPU; constant, linear-warmup
  + cosine, step decay and schedule-free AdamW at 3 peak learning rates, 3 seeds;
  measure validation loss and sensitivity to the peak learning rate. Keep it a small
  CPU study with reimplemented baselines, at least 5 seeds where cheap, and report
  negative or mixed results plainly.
problem: How much does the choice of learning-rate schedule (and a schedule-free optimiser)
  change the final validation loss of a tiny character-level GPT trained for a short
  fixed budget, and how much does it change robustness to the peak learning rate?
gap: Schedule comparisons are usually reported at a single tuned peak LR; the sensitivity
  of the ranking to the peak LR at a very short (1,500-step) budget on a laptop-scale
  GPT is rarely quantified, and Schedule-Free AdamW claims are mostly made at tuned
  settings.
contribution: A controlled, fully reimplemented comparison of constant, warmup+cosine,
  step decay and Schedule-Free AdamW over five peak learning rates with a defined
  sensitivity metric, a warmup ablation, and an honest report of where each fails.
hypotheses:
- id: H1
  statement: At the best of the three main peak LRs, warmup+cosine reaches lower validation
    loss than constant LR.
  test: Paired Welch t-test over seeds (rh compare) on val_loss at the per-system
    best main LR; refuted if not lower or p>0.05.
- id: H2
  statement: Schedule-Free AdamW has lower sensitivity to the peak LR (smaller worst-minus-best
    val_loss over the 3 main LRs) than warmup+cosine.
  test: Sensitivity metric from analysis/sens.py per seed; compare with rh compare;
    refuted if not smaller.
- id: H3
  statement: 'At the largest peak LR (1e-2) warmup length matters: cosine with no
    warmup is worse than with 100 warmup steps.'
  test: rh compare on val_loss in abl_warmup vs main at lr1e-2.
method:
  name: Warmup+Cosine
  summary: 'Reference schedule: 100-step linear warmup then cosine decay to 0.1x peak,
    with hand-written AdamW. Compared with constant, step decay and reimplemented
    Schedule-Free AdamW.'
