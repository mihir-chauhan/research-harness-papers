project: autoregressive-emulator-on-lorenz-96
problem: Autoregressive ML emulators of chaotic multiscale systems are trained on
  one-step targets but used for long rollouts. How much does training on multi-step
  rollouts (backpropagating through K emulator steps) help skill at medium range,
  and what does it cost in long-run stability and climatological variance?
gap: Rollout-loss fine-tuning is standard in ML weather models, yet its effect is
  rarely separated from other design choices and its effect on climatological variance
  (blurring) is rarely measured together with skill. A cheap, fully controlled two-scale
  Lorenz-96 testbed lets us sweep K with all else fixed.
contribution: 'A controlled sweep of the training rollout length K for a small circular
  1D CNN emulator of the 36 slow Lorenz-96 variables (truth: two-scale model with
  fast variables unobserved), against persistence, climatology and a linear stencil
  baseline, reporting RMSE/ACC vs lead time, long-run survival, and climatological
  variance, with an input-noise ablation.'
hypotheses:
- id: H1
  statement: Multi-step rollout training (K=4, K=8) lowers RMSE at lead 2 time units
    relative to one-step training (K=1).
  test: paired comparison over 5 seeds (rh compare, metric rmse_t20, K=1 vs K=4 and
    vs K=8), alpha 0.05
- id: H2
  statement: One-step-trained CNNs are less stable in 200-time-unit free runs (lower
    stable_frac) than multi-step-trained ones.
  test: rh compare on stable_frac over 5 seeds
- id: H3
  statement: Multi-step training reduces climatological variance (var_ratio below
    the one-step model's and below 1).
  test: rh compare on var_ratio over 5 seeds (surviving members)
- id: H4
  statement: The CNN beats persistence, climatology and the linear stencil in ACC
    lead time.
  test: rh compare on acc_leadtime over 5 seeds
method:
  name: CNN K=4
  summary: Circular 1D CNN residual one-step emulator trained with a K-step rollout
    loss; K=1 is the one-step reference.
  components:
  - rollout loss length K
  - input noise
  entrypoint: method/run.py
