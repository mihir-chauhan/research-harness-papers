slug: rbm-neural-quantum-state-tfim
direction: 'Neural quantum states at small scale: variational Monte Carlo with a restricted
  Boltzmann machine wavefunction for the 1D transverse-field Ising model with 8 to
  12 spins (numpy; exact diagonalisation as the reference). Compare the RBM at several
  hidden-unit densities against a mean-field product state and a Jastrow ansatz on
  ground-state energy error and magnetisation across the phase transition, with plain
  SGD and with stochastic reconfiguration.'
problem: Small-scale benchmark of neural quantum states (RBM) against mean-field and
  Jastrow variational states for the 1D TFIM.
gap: No compact, exactly evaluated optimiser-by-ansatz comparison with order-parameter
  errors across the critical point at N=8-12.
contribution: Controlled numpy VMC study (RBM alpha 1,2,4 / Jastrow / mean-field x
  SGD / SR) with exact-enumeration evaluation and 5 seeds.
hypotheses:
- id: H1
  statement: RBM-SR (alpha=2) beats mean-field and Jastrow in energy error on every
    task
  test: per-task paired comparison over 5 seeds (rh compare), mean ordering
- id: H2
  statement: SR beats SGD for the RBM (alpha=2) on every task
  test: per-task mean error ordering, rh compare
- id: H3
  statement: With SR, energy error decreases monotonically with alpha at Gamma=1
  test: mean error alpha=1>2>4 per size
- id: H4
  statement: Mean-field energy and |Mz| errors peak near Gamma=1 (N=10)
  test: argmax over the Gamma sweep within 0.25 of 1
- id: H5
  statement: RBM-SR error at Gamma=1 does not grow from N=8 to 12
  test: descriptive, 3 sizes
method:
  name: RBM alpha=2 SR
  summary: RBM log-amplitude with hidden density 2 trained by VMC with stochastic
    reconfiguration
  components:
  - RBM ansatz
  - stochastic reconfiguration
  entrypoint: method/run.py
tasks:
- tfim_N10_g0.25
