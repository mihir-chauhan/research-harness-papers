slug: lennard-jones-invariant-descriptors
direction: 'Toy ML interatomic potential on small Lennard-Jones clusters: raw coordinates
  vs sorted pairwise distances vs sum-pooled symmetry functions, with KRR and a small
  MLP; energy error, data efficiency, rotation/permutation behaviour.'
problem: Learn the energy of 5-13 atom Lennard-Jones clusters from geometry only,
  where the true energy is invariant to rotation, translation and atom permutation.
gap: Textbook descriptor comparisons rarely report, on one analytic testbed with identical
  splits, accuracy, learning curves and the measured invariance failure of non-invariant
  inputs for both a kernel and a neural model.
contribution: A small, fully reproducible controlled comparison (3 descriptors x 2
  regressors plus a Behler-Parrinello-style atomwise net) with learning curves and
  invariance tests; no new method is claimed.
hypotheses:
- id: H1
  statement: At n_train=500, each invariant descriptor (sorted distances, sum-pooled
    symmetry functions) gives lower test energy MAE than raw coordinates, for both
    KRR and MLP.
  test: Welch t-test over 5 seeds (rh compare) per regressor, alpha 0.05.
- id: H2
  statement: Raw-coordinate models degrade under rotation/permutation of the test
    set (MAE at least 2x the clean MAE), while invariant descriptors are unchanged
    (inv_defect < 1e-4 energy units).
  test: mae_rot_perm / energy_mae ratio and inv_defect, per system, 5 seeds.
- id: H3
  statement: Data efficiency - the MAE of the sum-pooled symmetry-function KRR is
    lower than that of sorted-distance KRR at n_train=50 and 150.
  test: Welch t-test over 3 seeds per size.
- id: H4
  statement: KRR beats the MLP of the same descriptor at small n (<=150) and the gap
    shrinks or reverses at larger n.
  test: Learning-curve comparison, per descriptor, 3 seeds at n in {50,150,500(5 seeds),1500}.
method:
  name: SymFn-sum KRR
  summary: Behler-Parrinello radial+angular symmetry functions per atom, sum-pooled
    over atoms into an invariant global descriptor, fed to RBF kernel ridge regression.
  components:
  - symmetry functions
  - sum pooling
  - kernel ridge regression
  entrypoint: method/run.py
tasks:
- lj_clusters
metrics:
  energy_mae:
    higher_is_better: false
  energy_mae_per_atom:
    higher_is_better: false
  mae_rot_perm:
    higher_is_better: false
  inv_defect:
    higher_is_better: false
  runtime_s:
    higher_is_better: false
    nondeterministic: true
seeds:
- 0
- 1
- 2
- 3
- 4
compute:
  gpus: 0
  max_minutes_per_run: 6
  max_total_minutes: 30
baselines:
- Mean predictor
- Raw coords KRR
- Raw coords MLP
- Sorted dist KRR
- Sorted dist MLP
- SymFn-sum MLP
- SymFn atomwise MLP (BP-style)
ablations:
- name: SymFn-sum KRR radial-only
  group: abl_sf
- name: SymFn-sum MLP radial-only
  group: abl_sf
- name: Raw coords MLP + rot/perm aug
  group: abl_aug
- name: SymFn-sum linear ridge
  group: abl_linear
- name: SymFn-sum linear ridge radial-only
  group: abl_linear
- name: Sorted dist linear ridge
  group: abl_linear
- name: SymFn-sum KRR (narrow grid)
  group: sweep_krrgrid
- name: SymFn-sum KRR (mid grid)
  group: sweep_krrgrid
ambition:
  target_tier: 2
  primary_metric: energy_mae
  primary_task: lj_clusters
  alpha: 0.05
  min_relative_gain: 0.1
  min_effect_size: 0.8
  groundbreaking_gain: 0.3
  max_iterations: 0
  patience: 1
  gpu_hour_budget: 0
gates: []
profile: quick
venue: ieee-icra
constants:
- name: mlp_steps
  value: 3000
  why: Adam steps of every MLP run in the main, learning-curve and ablation groups
    (default of --steps in method/run.py)
- name: mlp_width
  value: 128
  why: hidden width of the two-layer SiLU MLP and of the atomwise network
- name: mlp_batch
  value: 64
  why: minibatch size of every MLP run (method/run.py)
- name: mlp_lr_low
  value: 0.001
  why: smaller of the two Adam learning rates tried per MLP run, chosen on validation
    MAE
- name: mlp_lr_high
  value: 0.004
  why: larger of the two Adam learning rates tried per MLP run, chosen on validation
    MAE
- name: n_test
  value: 1000
  why: test configurations per run (default of --n_test in method/run.py)
- name: n_val_min
  value: 50
  why: minimum validation-set size; the validation set has max(50, n_train/4) configurations
- name: energy_cap
  value: 50
  why: 'truncation of the sampled energies: configurations are resampled until E <=
    50 (E_CAP in method/run.py)'
- name: sf_cutoff_radius
  value: 4
  why: cutoff radius R_c of the symmetry functions, reduced units
- name: sf_radial_shift_1
  value: 0.9
  why: radial symmetry-function shift r_s (first of six)
- name: sf_radial_shift_2
  value: 1.1
  why: radial symmetry-function shift r_s (second of six)
- name: sf_radial_shift_3
  value: 1.4
  why: radial symmetry-function shift r_s (third of six)
- name: sf_radial_shift_4
  value: 1.8
  why: radial symmetry-function shift r_s (fourth of six)
- name: sf_radial_shift_5
  value: 2.3
  why: radial symmetry-function shift r_s (fifth of six)
- name: sf_radial_shift_6
  value: 3
  why: radial symmetry-function shift r_s (sixth of six)
- name: sf_angular_eta_low
  value: 0.3
  why: smaller eta of the angular symmetry functions
- name: sf_angular_eta_high
  value: 1.5
  why: larger eta of the angular symmetry functions
- name: noise_std_min
  value: 0.02
  why: lower bound of the uniform range of the Gaussian noise std added to a library
    minimum
- name: noise_std_max
  value: 0.12
  why: upper bound of the uniform range of the Gaussian noise std added to a library
    minimum
- name: ball_radius_coef
  value: 0.62
  why: coefficient of N^(1/3) in the radius of the ball that random configurations
    are drawn from
- name: ball_radius_offset
  value: 0.35
  why: additive offset in the radius of the ball that random configurations are drawn
    from
- name: min_pair_distance
  value: 0.85
  why: rejection threshold on the pair distance of random configurations
- name: minima_random_starts
  value: 40
  why: L-BFGS random starts per cluster size when building the minima library
- name: krr_gamma_min
  value: 1.0e-07
  why: smallest kernel width gamma of the wide KRR grid
- name: krr_gamma_max
  value: 100
  why: largest kernel width gamma of the wide KRR grid; also the largest lambda of
    that grid
- name: krr_lambda_min
  value: 1.0e-13
  why: smallest ridge lambda of the wide KRR grid
- name: krr_narrow_gamma_min
  value: 0.01
  why: smallest gamma of the narrow (first-version) KRR grid
- name: krr_narrow_lambda_min
  value: 1.0e-09
  why: smallest lambda of the narrow (first-version) KRR grid
- name: krr_narrow_lambda_max
  value: 0.1
  why: largest lambda of the narrow and mid KRR grids
- name: krr_mid_gamma_min
  value: 0.0001
  why: smallest gamma of the mid KRR grid; also the invariance-defect threshold registered
    in H2
- name: krr_mid_lambda_min
  value: 1.0e-11
  why: smallest lambda of the mid KRR grid
- name: alpha
  value: 0.05
  why: significance level of the registered Welch tests (research.yaml ambition.alpha)
- name: tail_check_samples
  value: 4000
  why: number of untruncated samples per kind in the logged energy-tail check (--m
    of method/energy_tail.py)
