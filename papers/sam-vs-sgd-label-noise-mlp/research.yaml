slug: sam-vs-sgd-label-noise-mlp
direction: Sharpness-aware minimisation versus SGD on a small MLP with label noise
  (scikit-learn digits or a synthetic two-spirals / Gaussian-mixture task). Does SAM
  improve test accuracy under label noise at this scale, how sensitive is it to the
  neighbourhood size rho, and does the measured sharpness (loss increase under weight
  perturbation) track the generalisation gap? Compare SGD, SGD with weight decay,
  and SAM.
problem: Does SAM improve clean test accuracy of a small MLP trained on symmetric-label-noise
  data, relative to SGD and SGD+weight decay, and does measured sharpness track the
  generalisation gap?
gap: Evidence for SAM under label noise is mostly CNN/GPU scale; no equal-tuning small-scale
  comparison with weight decay and a rho sweep and a sharpness-gap correlation.
contribution: A controlled CPU-scale comparison of SGD, SGD+WD and SAM under label
  noise with validation-selected hyperparameters, a rho and wd sweep, two ablations
  and a sharpness-gap correlation analysis.
hypotheses:
- id: H1
  statement: SAM has higher clean test accuracy than SGD and SGD+WD on noisy digits
    (noise 0.2, 0.4).
  test: paired t-test over 5 seeds per task (rh compare), alpha 0.05
- id: H2
  statement: SAM test accuracy has an interior optimum in rho.
  test: rho sweep with 5 seeds per task
- id: H3
  statement: Fixed-norm sharpness is positively rank-correlated with the generalisation
    gap.
  test: Spearman correlation over runs, pooled and per task
method:
  name: SAM
  summary: 'Sharpness-aware minimisation: one normalised-gradient ascent step of radius
    rho, gradient at the perturbed weights, applied with momentum SGD.'
  components:
  - adversarial perturbation
  - rho
  entrypoint: method/run.py
tasks:
- digits_n0.0
- digits_n0.2
- digits_n0.4
- spirals_n0.2
