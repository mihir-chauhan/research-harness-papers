slug: label-noise-and-data-size-in-segmentation-on-syn
direction: Label noise and data size in segmentation on synthetic shapes. generate
  64x64 images of overlapping circles, squares and triangles on textured backgrounds
  with numpy (2k train / 500 test); train a small U-Net on CPU with 100-2,000 images
  and with 0-30 percent boundary/label noise, 3 seeds; measure mIoU per class. Keep
  it a small CPU study with reimplemented baselines, at least 5 seeds where cheap,
  and report negative or mixed results plainly.
problem: How do the amount of training data and the kind and level of label noise
  (boundary jitter vs whole-object class flips) jointly determine the per-class IoU
  of a small U-Net on synthetic overlapping shapes?
gap: Label-noise studies focus on classification or large real datasets; the interaction
  between training-set size (100-2000) and noise type/level in dense prediction, and
  whether classification-style robust losses help under boundary noise, is rarely
  measured in a controlled setting where the ground truth is exactly known.
contribution: A controlled, fully reproducible CPU study (4 seeds in the main grid,
  3 in sweeps) of data size x noise type x noise level for a small U-Net, with reimplemented
  CE, GCE and SCE baselines and a band-ignore loss, reporting per-class IoU and including
  negative results.
hypotheses:
- id: H1
  statement: With clean labels, test mIoU of the U-Net increases from 100 to 2000
    training images.
  test: Welch t-test (alpha 0.05) between N=100 and N=2000 over 4 seeds (CE, clean
    labels).
- id: H2
  statement: At the same nominal level p=0.3, object class-flip noise lowers mIoU
    more than boundary noise (N=500, CE).
  test: Welch t-test (alpha 0.05) of mIoU under flip_p0.3 vs boundary_p0.3 over 5
    seeds.
- id: H3
  statement: The mIoU loss caused by class-flip noise (p=0.3) is larger at N=100 than
    at N=2000 (more data dilutes noise).
  test: Welch t-test (alpha 0.05) of per-seed drops (clean minus flip_p0.3 mIoU) at
    N=100 vs N=2000.
- id: H4
  statement: Robust losses (GCE, SCE, band-ignore CE) beat plain CE under noise at
    N=500 and do not lose on clean labels.
  test: Welch t-test (alpha 0.05) per noise task, each robust loss vs CE, 5 seeds
    (rh compare).
method:
  name: Band-ignore CE
  summary: Cross-entropy that ignores pixels within 2 px of a label edge in the (noisy)
    training mask, aimed at boundary noise; compared with plain CE and reimplemented
    GCE and SCE under the same U-Net, optimiser and budget.
