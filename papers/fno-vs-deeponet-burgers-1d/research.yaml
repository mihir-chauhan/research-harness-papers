profile: quick
venue: ieee-icra
constants:
- name: nu
  value: 0.01
  why: viscosity of the Burgers task (task definition)
- name: grid_train
  value: 128
  why: training grid points; also the DeepONet sensor count and the MLP input/output
    width
- name: grid_fine_2x
  value: 256
  why: zero-shot test grid, 2x finer than the training grid
- name: grid_fine_4x
  value: 512
  why: zero-shot test grid, 4x finer than the training grid; also the solver grid
- name: mlp_hidden_width
  value: 512
  why: hidden width of the MLP baseline (128-512-512-128)
- name: n_train
  value: 400
  why: training pairs per seed in the main comparison
- name: n_val
  value: 100
  why: validation pairs per seed
- name: n_test
  value: 100
  why: test pairs per seed
- name: n_pool
  value: 600
  why: initial conditions drawn per seed (400 train + 100 validation + 100 test)
- name: data_seed_offset
  value: 1000
  why: data generator seed is 1000 + run seed
- name: grad_steps_n200
  value: 1000
  why: 'gradient steps at 200 training pairs: 100 epochs x 10 batches of 20 (a setting,
    not a measurement)'
- name: epochs_main
  value: 100
  why: training epochs for every system in the main comparison
- name: tuning_seed
  value: 100
  why: seed used only for learning-rate tuning (disjoint data)
- name: solver_dt
  value: 0.001
  why: time step of the ETDRK4 data solver
- name: weight_decay
  value: 1.0e-05
  why: Adam weight decay, all systems
- name: h1_alpha
  value: 0.05
  why: significance level of the registered H1 Welch test
- name: h1_min_gain
  value: 0.1
  why: 'registered H1/H3 threshold: 10% relative difference'
- name: h2_ratio_threshold
  value: 1.5
  why: registered H2 threshold on the fine-grid / training-grid error ratio
