slug: low-n-regression-on-the-gb1-four-site-landscape
direction: Low-N regression on the GB1 four-site landscape. Download the GB1 four-site
  data (about 150k variants, one CSV from the FLIP repository). Compare one-hot ridge,
  one-hot with pairwise epistasis features, a Gaussian process and a small CNN trained
  on N = 48, 96, 384, 2000 random or single / double-mutant-only variants. Measure
  Spearman and top-100 recall on the remaining variants over 5 draws. Keep it a small
  CPU study with reimplemented baselines, at least 5 seeds where cheap, and report
  negative or mixed results plainly.
problem: How well do simple supervised regressors recover the GB1 four-site fitness
  landscape from very few labels (N=48..2000), and does modelling pairwise epistasis,
  a GP kernel or a CNN help?
gap: Low-N comparisons of one-hot ridge, pairwise-epistasis ridge, GP and CNN on the
  full 149k GB1 landscape are usually reported only for Spearman on random or FLIP
  splits; top-k recall, per-Hamming-distance breakdown and single/double-mutant-only
  training are rarely shown together under identical tuning.
contribution: A controlled, fully reimplemented CPU comparison of four regressors
  on the complete GB1 four-site landscape, over random and single/double-mutant-only
  training sets, with Spearman, top-100 recall and a per-distance analysis.
hypotheses:
- id: H1
  statement: Pairwise epistasis features help (higher Spearman than additive one-hot
    ridge) only when N is large (N>=384) with random training data; at N<=96 they
    do not.
  test: Paired Wilcoxon signed-rank over 5 seeds via rh compare, spearman, task rand_N,
    pairwise vs ridge
- id: H2
  statement: A GP with a Hamming-distance kernel is at least as good as ridge at N<=96
    random.
  test: rh compare spearman at rand_48, rand_96
- id: H3
  statement: The small CNN is worse than the best linear/kernel model at N<=384 and
    does not clearly overtake it at N=2000.
  test: rh compare spearman, CNN vs best baseline per task
- id: H4
  statement: Training on single/double mutants only gives lower Spearman on HD>=3
    variants than random training with the same N, for every system.
  test: Compare spearman_hd3 and spearman_hd4 of dbl_N vs rand_N tables (rh compare
    is per task, so reported as table rows)
- id: H5
  statement: Top-100 recall stays below 0.25 for every system and N<=384.
  test: top100_recall means
method:
  name: One-hot + pairwise ridge
  summary: Ridge regression on one-hot site features plus all 6 pairwise site-by-site
    one-hot interaction features, alpha by 5-fold CV on the training set. Compared
    against one-hot ridge, a Hamming-kernel GP and a small CNN, all reimplemented.
  components:
  - pairwise interaction features
  - CV-selected ridge penalty
  entrypoint: method/run.py
