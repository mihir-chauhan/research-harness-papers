slug: gcn-homophily-sbm
direction: When does message passing help? On synthetic stochastic block model graphs
  with controlled homophily (from strongly heterophilous to strongly homophilous)
  and node features of controlled informativeness, compare an MLP on features, a 2-layer
  GCN, a GCN with separate self and neighbour weights (the H2GCN idea) and label propagation,
  all written in plain torch. Map the regions where each wins and test the mid-homophily
  regime where GCN is known to fall below the MLP.
problem: Map when message passing (GCN, ego/neighbour-separated GCN, label propagation)
  beats a feature-only MLP on contextual SBMs as homophily and feature informativeness
  vary.
gap: Benchmark comparisons confound homophily, feature quality and degree; a controlled
  CSBM grid with seeds gives a clean win-region map and a test of the mid-homophily
  GCN<MLP dip.
contribution: A small empirical map (11 homophily levels x 3 feature strengths x 5
  seeds) of four reimplemented models, with registered hypothesis tests and an ablation
  of ego/neighbour separation.
hypotheses:
- id: H1
  statement: At h in {0.3,0.4,0.5}, mu=1, GCN accuracy is below MLP.
  test: paired t-test over 5 seeds per cell, alpha 0.05
- id: H2
  statement: H2GCN-style is within 0.02 of or above max(MLP,GCN) in every cell.
  test: cell-mean accuracy difference over 33 cells
- id: H3
  statement: LP is best only at h>=0.8 with weak features (mu=0.5) and is below MLP
    for h<=0.5.
  test: cell-mean ranking
- id: H4
  statement: The lowest h at which GCN mean accuracy exceeds MLP is lower for weak
    features (mu=0.5) than for strong features (mu=2).
  test: crossover h per mu from cell means
- id: H5
  statement: Tying self/neighbour weights hurts H2GCN at h in {0.1,0.4}, mu=1.
  test: paired t-test over 5 seeds
