slug: dyna-planning-under-model-error
direction: 'Model-based RL under model error: Dyna-Q with a learned tabular model
  on gridworlds whose dynamics change mid-training or are stochastic. How does the
  number of planning steps trade sample efficiency against the damage from a stale
  or wrong model? Compare Q-learning (no planning), Dyna-Q, Dyna-Q+ (exploration bonus
  for stale transitions) and prioritized sweeping.'
problem: How planning-step count trades sample efficiency against stale or wrong learned
  tabular models in Dyna-style agents.
gap: Textbook comparisons (Sutton & Barto) show single runs of Dyna-Q/Dyna-Q+ on two
  mazes; no paired-seed sweep of n across staleness, shortcut, and stochastic regimes
  with prioritized sweeping.
contribution: A controlled small-scale reimplementation study of Q-learning, Dyna-Q,
  Dyna-Q+ and prioritized sweeping over planning steps n on five maze regimes, with
  10-20 seeds and ablations of the Dyna-Q+ components.
hypotheses:
- id: H1
  statement: On a static maze, planning raises early reward over Q-learning.
  test: early_reward, static task, Dyna-Q n=10 vs Q-learning, 20 seeds
- id: H2
  statement: On the blocking maze larger n hurts recovery for Dyna-Q; Dyna-Q+ recovers
    better.
  test: post_reward on blocking vs n and vs Dyna-Q+
- id: H3
  statement: On the shortcut maze Dyna-Q+ gets more post-change reward than Dyna-Q.
  test: post_reward on shortcut
- id: H4
  statement: Under slip 0.3 the benefit of planning shrinks or reverses at large n.
  test: cum_reward on stochastic vs n
- id: H5
  statement: Prioritized sweeping matches Dyna-Q on static tasks and shares its staleness
    failure.
  test: cum_reward static, post_reward blocking
method:
  name: Dyna-Q
  summary: Tabular Dyna-Q with last-outcome deterministic model and n uniform planning
    updates per real step, studied over n and compared against reimplemented Q-learning,
    Dyna-Q+, prioritized sweeping.
  components:
  - last-outcome model
  - uniform planning
  entrypoint: method/run.py
